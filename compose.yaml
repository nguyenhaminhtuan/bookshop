services:
  db:
    image: quay.io/debezium/postgres:17-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DBNAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:8.4
    ports:
      - 6379:6379

  kafka:
    image: quay.io/debezium/kafka:3.5
    ports:
      - 9092:9092
    environment:
      - CLUSTER_ID=oh-sxaDRTcyAr6pFRbXyzA
      - NODE_ID=1
      - NODE_ROLE=combined
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=
    healthcheck:
      test:
        [
          CMD-SHELL,
          '/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    env_file:
      - .env

  kafka_connect:
    image: quay.io/debezium/connect:3.5
    ports:
      - 8083:8083
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=connect
      - CONFIG_STORAGE_TOPIC=connect-configs
      - OFFSET_STORAGE_TOPIC=connect-offsets
      - STATUS_STORAGE_TOPIC=connect-status
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8083/connectors >/dev/null']
      interval: 10s
      timeout: 10s
      retries: 12
    env_file:
      - .env

  debezium_outbox:
    image: curlimages/curl
    depends_on:
      db:
        condition: service_healthy
      kafka_connect:
        condition: service_healthy
    restart: 'no'
    command:
      - sh
      - -ec
      - |
        curl -fsS -X PUT http://kafka_connect:8083/connectors/bookshop-outbox-connector/config \
          -H 'Content-Type: application/json' \
          -d '{
            "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
            "database.hostname": "db",
            "database.port": "5432",
            "database.user": "${DB_USER}",
            "database.password": "${DB_PASSWORD}",
            "database.dbname": "${DB_DBNAME}",
            "topic.prefix": "${DB_DBNAME}",
            "plugin.name": "pgoutput",
            "schema.include.list": "events",
            "table.include.list": "events.outbox",
            "slot.name": "bookshop_outbox_slot",
            "include.schema.changes": "false",
            "tombstones.on.delete": "false",
            "transforms": "outbox",
            "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
            "transforms.outbox.route.by.field": "aggregate_type",
            "transforms.outbox.route.topic.replacement": "bookshop.$${routedByValue}",
            "transforms.outbox.table.field.event.id": "id",
            "transforms.outbox.table.field.event.type": "event_type",
            "transforms.outbox.table.field.event.key": "aggregate_id",
            "transforms.outbox.table.field.event.payload": "payload",
            "transforms.outbox.table.fields.additional.placement": "type:header:eventType",
            "transforms.outbox.table.expand.json.payload": "true"
          }'
    env_file:
      - .env

volumes:
  db_data:
